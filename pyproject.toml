[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northern-news-monitor"
version = "0.1.0"
description = "Collects northern-Pakistan weather and hazard news from public feeds, official advisories and forecasts into a daily CSV."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27,<1.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
nnm = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# UP046/UP047: keep explicit TypeVar generics (clearer with Pydantic models).
ignore = ["B008", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/db/migrations/*" = ["E501"]
